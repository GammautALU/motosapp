<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MotoShop | Gestión de Motos</title>
    <style>
        :root {
            --primary: #ff5722;
            --primary-dark: #e64a19;
            --dark: #1f2937;
            --darker: #111827;
            --light: #f3f4f6;
            --green: #16a34a;
            --blue: #2563eb;
            --yellow: #f59e0b;
            --red: #dc2626;
            --gray: #6b7280;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        /* NAVBAR */
        .navbar {
            background: var(--darker);
            border-bottom: 3px solid var(--primary);
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .brand { color: white; font-size: 22px; font-weight: 800; text-decoration: none; letter-spacing: 1px; }
        .brand span { color: var(--primary); }
        .nav-links a {
            color: #d1d5db;
            text-decoration: none;
            margin-left: 22px;
            font-weight: 600;
            padding: 8px 4px;
            border-bottom: 2px solid transparent;
            transition: all .2s;
        }
        .nav-links a:hover { color: white; border-bottom-color: var(--primary); }

        /* CONTENEDOR */
        .container {
            max-width: 1000px;
            margin: 35px auto;
            background: white;
            padding: 30px 35px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,.35);
        }
        h1 { margin: 0 0 5px; font-size: 32px; color: var(--darker); }
        h2 { margin-top: 0; color: var(--darker); border-left: 5px solid var(--primary); padding-left: 12px; }
        .subtitle { color: var(--gray); margin: 0 0 20px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }

        /* BOTONES */
        .btn {
            display: inline-block;
            padding: 9px 18px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            margin: 2px;
            transition: transform .15s, box-shadow .15s, filter .15s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,.25); filter: brightness(1.08); }
        .btn-green  { background: var(--green); }
        .btn-blue   { background: var(--blue); }
        .btn-yellow { background: var(--yellow); }
        .btn-red    { background: var(--red); }
        .btn-gray   { background: var(--gray); }
        .btn-orange { background: var(--primary); }

        /* TABLA */
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 15px; overflow: hidden; border-radius: 10px; }
        th { background: var(--dark); color: white; padding: 14px; text-align: left; font-size: 14px; text-transform: uppercase; letter-spacing: .5px; }
        td { padding: 14px; border-bottom: 1px solid #e5e7eb; }
        tbody tr { transition: background .15s; }
        tbody tr:hover { background: #fff3ee; }
        .badge { background: #ffe4d9; color: var(--primary-dark); padding: 4px 10px; border-radius: 20px; font-weight: 700; font-size: 13px; }
        .price { font-weight: 800; color: var(--green); }
        .empty { text-align: center; color: var(--gray); padding: 40px !important; font-size: 17px; }

        /* FORMULARIOS */
        form p { margin-bottom: 18px; display: flex; flex-direction: column; }
        form label { font-weight: 700; margin-bottom: 6px; color: var(--dark); }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 11px 12px;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color .2s, box-shadow .2s;
        }
        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255,87,34,.15);
        }
        .errorlist { list-style: none; margin: 0 0 6px; padding: 8px 12px; background: #fee2e2; color: var(--red); border-radius: 6px; font-size: 14px; font-weight: 600; }
        .helptext { color: var(--gray); font-size: 13px; }

        /* DETALLE */
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin: 20px 0 25px; }
        .detail-item { background: var(--light); padding: 16px; border-radius: 12px; border-top: 4px solid var(--primary); }
        .detail-item small { display: block; color: var(--gray); text-transform: uppercase; font-size: 12px; letter-spacing: .5px; }
        .detail-item strong { font-size: 20px; }

        /* ELIMINAR */
        .danger-box { background: #fef2f2; border: 2px solid #fecaca; border-radius: 12px; padding: 20px; margin: 15px 0 25px; }

        footer { text-align: center; color: #9ca3af; padding: 10px 0 30px; font-size: 14px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'lista_motos' %}" class="brand">🏍️ Moto<span>Shop</span></a>
        <div class="nav-links">
            <a href="{% url 'lista_motos' %}">Catálogo</a>
            <a href="{% url 'crear_moto' %}">Nueva Moto</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer>MotoShop · Tienda de motocicletas</footer>
</body>
</html>
