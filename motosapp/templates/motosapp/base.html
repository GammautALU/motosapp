<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Motos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f8; color: #333; }
        .container { max-width: 900px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #34495e; color: white; }
        .btn { display: inline-block; padding: 8px 14px; text-decoration: none; border-radius: 4px; color: white; font-size: 14px; margin: 2px; }
        .btn-green { background-color: #27ae60; }
        .btn-blue { background-color: #2980b9; }
        .btn-yellow { background-color: #f39c12; }
        .btn-red { background-color: #c0392b; }
        .btn-gray { background-color: #7f8c8d; }
        form p { margin-bottom: 15px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
